[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lastsearch"
version = "1.0.0"
description = "Python SDK for LastSearch — Grounded Intelligence research infrastructure for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "LastSearch" }]
keywords = ["ai", "research", "search", "agents", "mcp", "langchain", "crewai", "rag", "deep-search", "web-search", "citations", "evidence", "llm", "agent-tools", "autogpt", "llamaindex", "fact-checking", "ai-search", "lastsearch", "lastsearch", "lastsearch", "lastsearch", "confidence-scoring", "hallucination-prevention", "grounded-intelligence", "verified-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
lastsearch = "lastsearch.cli:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
crewai = ["crewai>=0.41.0"]

[project.urls]
Homepage = "https://lastsearch.dev"
Documentation = "https://lastsearch.dev/developers"
Repository = "https://github.com/lastsearch-hq/lastsearch"
Discord = "https://discord.gg/ubAuT4YQsT"
