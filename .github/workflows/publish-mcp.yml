name: Publish MCP Package

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp/**'
      - '!apps/mcp/**/*.md'

permissions: {}

jobs:
  build:
    name: Build MCP package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build MCP package
        run: pnpm --filter lastsearch build
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-package
          path: |
            apps/mcp/dist
            apps/mcp/package.json
            apps/mcp/README.md
            apps/mcp/LICENSE
            apps/mcp/NOTICE
            apps/mcp/server.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm + MCP Registry
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcp-package
          path: mcp
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Check version against npm
        id: version
        working-directory: mcp
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view lastsearch version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT" = "$PUBLISHED" ]; then
            echo "Version unchanged ($CURRENT), skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing: $PUBLISHED -> $CURRENT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        working-directory: mcp
        # Already built in the build job; skip lifecycle scripts here.
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Wait for npm indexing
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION=$(node -p "require('./mcp/package.json').version")
          echo "Waiting for lastsearch@$VERSION to be resolvable on npm (registry validates it)..."
          for i in $(seq 1 24); do
            if npm view "lastsearch@$VERSION" version >/dev/null 2>&1; then echo "indexed after $((i*10))s"; exit 0; fi
            sleep 10
          done
          echo "lastsearch@$VERSION still not resolvable after 240s" && exit 1
      - name: Install mcp-publisher
        if: steps.version.outputs.skip != 'true'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Update server.json version
        if: steps.version.outputs.skip != 'true'
        working-directory: mcp
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          jq --arg v "$CURRENT" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Publish to MCP Registry
        if: steps.version.outputs.skip != 'true'
        working-directory: mcp
        run: |
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
