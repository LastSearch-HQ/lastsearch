            "text": "LastSearch (lastsearch.ai) is free, open source research infrastructure for AI agents, run as a non-commercial passion project. It provides real-time web search with citations and estimated confidence scores. Sources can be wrong or out of date, so results are not guaranteed to be true or complete. Available as an MCP server, REST API, and Python SDK."

          "@type": "Question",
          "name": "How does the confidence scoring work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LastSearch computes an estimated confidence score from several signals about the sources it found (how many, how much they agree, domain authority and more), rather than asking the LLM to rate itself. It is an automated estimate, not a measure of certainty."
          }
        },
        {
          "@type": "Question",
          "name": "What integrations does LastSearch support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LastSearch supports MCP (Model Context Protocol) for Claude and other AI assistants, a REST API for any HTTP client, and a Python SDK (pip install lastsearch or pip install lastsearch) for Python applications. Install the MCP server with npm: npx lastsearch or npx lastsearch."
          }
        },
        {
          "@type": "Question",
          "name": "What is Clarity?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Clarity is LastSearch's answer mode that aims to reduce hallucinations. Two modes: (1) Default — fast LLM-only answer using grounding prompt techniques (no internet), (2) Verified — also runs the web search pipeline and combines both into one answer with sources. Returns answer, claims (with origin tracking: llm/source/confirmed), confidence, and techniques applied. Use via POST /browse/clarity, clarity MCP tool, or client.clarity() in the Python SDK."
          }
        },
