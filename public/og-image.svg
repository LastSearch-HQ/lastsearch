  <circle cx="1050" cy="120" r="300" fill="#F97316" opacity="0.06"/>
  <circle cx="140" cy="560" r="220" fill="#F97316" opacity="0.05"/>
  <defs>
    <linearGradient id="lsg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
